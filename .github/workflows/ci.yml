# Thin caller of core's reusable per-repo CI (req-tap-plugin-extdev-repo-ci). Two pins,
# independent (req-tap-plugin-extdev-repo-ci-9): the `uses:` SHA pins WHICH validation
# logic runs; the plugin's manifest `requires_tap` pins WHICH core it runs against — the
# harness is core at the tag v<floor>, resolved by the workflow (req-tap-plugin-extdev-repo-ci-7).
# No `harness_ref` (that is an override for the nightly and debugging, never a PR default)
# and no `boot_profile` (retired form): the in-package tap_plugin/sigstore_core/boot/ci.boot.json
# IS the opt-in, and conformance fails closed without it (req-boot-bootstrap-ci-record-6).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tap:
    # A job-level block replaces the top-level one, so it restates contents: read. GitHub checks
    # every permission a called workflow's jobs declare before any job starts; plugin-ci from
    # tap#822 on uploads its dependency scan as SARIF, which needs security-events: write. This
    # grants upload to this repo's Security tab only, never code write.
    permissions:
      contents: read
      security-events: write
    # tap#365 / PR# 373 - tap: plugin-ci fails closed and tests the declared floor. Move
    # this pin to the SHA of tap main once PR# 373 merges (Renovate does not track it).
    uses: unified-systems-com/tap/.github/workflows/plugin-ci.yml@210409a20ad44e6f747f01bf6da9ccd2cbc04015
    with:
      plugin_slug: sigstore_core
    secrets:
      harness_pat: ${{ secrets.TAP_CORE_RO_PAT }}
