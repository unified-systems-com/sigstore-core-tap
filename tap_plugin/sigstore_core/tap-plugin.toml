manifest_version = "0"
plugin_version = "0.1.0"
requires_tap = ">=0.1.5"
slug = "sigstore_core"
name = "TAP Sigstore Core"
description = "Sigstore-ecosystem models and the canonical TAP-side helpers for verifying Sigstore signature bundles and decomposing them into graph data."

depends_on = [
    { slug = "identity_core", note = "IDENTITY_VOUCHED_BY_ISSUER targets the identity_core__oidc_issuer type (edge/vocabulary dependency — no code import); needs the type registered." },
]

[models]
sigstore_core__rekor_log_entry = "tap_plugin.sigstore_core.models.rekor_log_entry.RekorLogEntry"
sigstore_core__sigstore_ca = "tap_plugin.sigstore_core.models.sigstore_ca.SigstoreCa"

[edges]
ATTESTED_BY_LOG_ENTRY__sigstore_core = "edges/ATTESTED_BY_LOG_ENTRY.edge.json"
CERT_ISSUED_BY_CA__sigstore_core = "edges/CERT_ISSUED_BY_CA.edge.json"
SIGNED_BY_IDENTITY__sigstore_core = "edges/SIGNED_BY_IDENTITY.edge.json"
IDENTITY_VOUCHED_BY_ISSUER__sigstore_core = "edges/IDENTITY_VOUCHED_BY_ISSUER.edge.json"
REQUESTS_SIGSTORE_SIGNATURE__sigstore_core = "edges/REQUESTS_SIGSTORE_SIGNATURE.edge.json"

[[boot.records]]
name = "ci"
description = "RESERVED NAME (req-boot-bootstrap-ci-record): the stack this plugin's own tests run in — depends_on closure + self, offline, credential-free. The consumer flips self to editable."
